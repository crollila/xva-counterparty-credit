name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt && pip install -e .
      - name: Tests
        run: python -m pytest
      - name: Experiment smoke run (quick mode)
        run: python run_all.py --quick --skip-tests
      - name: README / ANALYSIS reconciliation against committed results
        run: python -m xva.report --check
