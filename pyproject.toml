[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xva-counterparty-credit"
version = "1.0.0"
description = "Educational Monte Carlo counterparty exposure and XVA engine (simulated portfolio, simplified methodology)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
